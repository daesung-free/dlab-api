services:
  postgres:
    image: postgres:16
    container_name: dlab-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - dlab_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: dlab-redis-local
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - dlab_redis_data:/data

volumes:
  dlab_postgres_data:
  dlab_redis_data: