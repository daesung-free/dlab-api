plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.dlab'
version = '0.0.1-SNAPSHOT'
description = 'dlab-api'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

ext {
    querydslVersion = '6.11'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    // 키오스크 구획 감시용. 우리 장애가 키오스크 화면에서는 안 보이므로(폴백이 가린다)
    // 외부 모니터가 직접 찔러볼 창구가 필요하다 — CLAUDE.md §3
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // JWT — jjwt는 api/impl/jackson 3개를 함께 넣어야 동작한다
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // API 스펙 자동생성. 이 레포가 스펙의 단일 진실 공급원이고(CLAUDE.md §6-4)
    // dlab-admin-web(openapi-typescript)·dlab-app(openapi-generator)이 여기서 타입을 뽑는다.
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.0'

    // ★ javadoc을 그대로 API 문서 설명으로 끌어온다.
    //   이 레포는 "왜 이렇게 했는가"를 javadoc에 적는 규칙이라, 컨트롤러 53개·엔드포인트
    //   283개에 @Operation을 손으로 다시 쓰면 같은 설명이 두 벌이 되고 한쪽만 낡는다.
    implementation 'com.github.therapi:therapi-runtime-javadoc:0.15.0'
    annotationProcessor 'com.github.therapi:therapi-runtime-javadoc-scribe:0.15.0'

    // 엑셀 Import/Export. 학생 일괄 등록(P1-02)·명단 출력(F-4.9)이 여기 의존한다.
    implementation 'org.apache.poi:poi-ooxml:5.4.1'

    // 동적 검색 빌더. 학생 검색만 12개 조건이라 조건 조합이 코드로 관리되지 않으면 감당이 안 된다.
    // openfeign 포크를 쓰는 이유: 본가 querydsl은 릴리스가 멈춰 Hibernate 7(Boot 4)을 지원하지 않는다.
    implementation "io.github.openfeign.querydsl:querydsl-jpa:${querydslVersion}"
    annotationProcessor "io.github.openfeign.querydsl:querydsl-apt:${querydslVersion}:jakarta"
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}

// ★ ./gradlew bootRun 만 쳐도 local 프로필로 뜨게 한다.
//
//   DB 접속정보를 application.yml 이 아니라 application-local.yml 에만 둔 것은
//   의도적이다 — 그 파일이 .gitignore 에 걸려 있어 접속정보가 git 에 올라가지 않는다.
//   대신 프로필을 빼먹으면 "Failed to determine a suitable driver class" 로 기동이
//   실패한다. 레포를 새로 받은 사람은 이 오류부터 만나게 된다.
//
//   시스템 프로퍼티라 --args 가 항상 이긴다. CI 의
//   `bootRun --args='--spring.profiles.active=ci'` 는 그대로 동작한다.
//   빌드된 jar 에는 영향이 없다 — gradle bootRun 한정이다.
tasks.named('bootRun') {
    systemProperty 'spring.profiles.active',
            providers.systemProperty('spring.profiles.active').getOrElse('local')
}
