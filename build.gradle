plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.dlab'
version = '0.0.1-SNAPSHOT'
description = 'dlab-api'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

ext {
    querydslVersion = '6.11'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    // 키오스크 구획 감시용. 우리 장애가 키오스크 화면에서는 안 보이므로(폴백이 가린다)
    // 외부 모니터가 직접 찔러볼 창구가 필요하다 — CLAUDE.md §3
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // JWT — jjwt는 api/impl/jackson 3개를 함께 넣어야 동작한다
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // API 스펙 자동생성. 이 레포가 스펙의 단일 진실 공급원이고(CLAUDE.md §6-4)
    // dlab-admin-web(openapi-typescript)·dlab-app(openapi-generator)이 여기서 타입을 뽑는다.
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.0'

    // ★ javadoc을 그대로 API 문서 설명으로 끌어온다.
    //   이 레포는 "왜 이렇게 했는가"를 javadoc에 적는 규칙이라, 컨트롤러 53개·엔드포인트
    //   283개에 @Operation을 손으로 다시 쓰면 같은 설명이 두 벌이 되고 한쪽만 낡는다.
    implementation 'com.github.therapi:therapi-runtime-javadoc:0.15.0'
    annotationProcessor 'com.github.therapi:therapi-runtime-javadoc-scribe:0.15.0'

    // S3 파일 저장. 첨부(성적표·재학증명서·사유 증빙)와 공개 이미지가 여기 의존한다.
    //
    // ★ v2 를 쓴다 — v1(com.amazonaws)은 2025 년에 지원이 끝났다.
    // ★ BOM 으로 버전을 한 곳에서 잡는다. s3 와 presigner 버전이 어긋나면
    //   서명 방식이 달라져 presigned URL 이 403 을 낸다.
    implementation platform('software.amazon.awssdk:bom:2.29.0')
    implementation 'software.amazon.awssdk:s3'
    // presigned URL 발급용. 비공개 파일은 CloudFront 를 두지 않고 이걸로 내려준다.
    implementation 'software.amazon.awssdk:s3-transfer-manager'

    // 엑셀 Import/Export. 학생 일괄 등록(P1-02)·명단 출력(F-4.9)이 여기 의존한다.
    implementation 'org.apache.poi:poi-ooxml:5.4.1'

    // 동적 검색 빌더. 학생 검색만 12개 조건이라 조건 조합이 코드로 관리되지 않으면 감당이 안 된다.
    // openfeign 포크를 쓰는 이유: 본가 querydsl은 릴리스가 멈춰 Hibernate 7(Boot 4)을 지원하지 않는다.
    implementation "io.github.openfeign.querydsl:querydsl-jpa:${querydslVersion}"
    annotationProcessor "io.github.openfeign.querydsl:querydsl-apt:${querydslVersion}:jakarta"
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}
