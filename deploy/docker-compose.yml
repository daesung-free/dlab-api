# 서버(EC2) 배포용 compose.
#
# ★ 루트의 docker-compose.yml 과 다른 파일이다. 그쪽은 로컬 개발용(DB·Redis만 띄우고
#   앱은 IDE에서 실행)이고, 이 파일은 앱까지 컨테이너로 띄운다. 합치지 말 것 —
#   합치면 로컬에서 `docker compose up` 할 때마다 앱 컨테이너가 같이 떠서 8080이 겹친다.
#
# 서버 배치 위치: /home/ubuntu/dlab-api/docker-compose.yml (워크플로가 배포마다 덮어쓴다)
# 같은 디렉터리의 .env 에서 값을 읽는다. 절차는 deploy/README.md 참고.
#
# 사용:
#   docker compose up -d --wait      기동(헬스체크 통과까지 대기)
#   docker compose logs -f app       로그
#   docker compose ps                상태

name: dlab-api

services:
  # ─────────────────────────────────────────────────────────
  # PostgreSQL
  # ─────────────────────────────────────────────────────────
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      # ★ 이 셋은 볼륨이 비어 있을 때 딱 한 번만 반영된다(초기화 시점).
      #   이미 데이터가 있는 볼륨에 대고 비밀번호를 바꿔도 아무 일도 일어나지 않는다 —
      #   앱만 접속에 실패하고, 원인이 안 보여서 한참 헤맨다.
      #   바꾸려면 ALTER USER 로 DB 안에서 바꾸고 .env 를 맞춘다.
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Seoul
    ports:
      # ★ 127.0.0.1 을 반드시 붙인다. "5432:5432" 로 쓰면 docker가 iptables 를 직접 만져
      #   보안그룹과 무관하게 인터넷에 DB가 열린다(UFW로도 안 막힌다).
      #   서버에서 psql 로 붙을 때만 쓰는 통로다.
      - "127.0.0.1:5432:5432"
    volumes:
      # 명명 볼륨 — 컨테이너를 지우고 다시 만들어도 데이터가 남는다.
      # `docker compose down -v` 만이 이걸 지운다(그래서 -v 를 습관적으로 붙이지 말 것).
      - db_data:/var/lib/postgresql/data
    healthcheck:
      # $$ 는 compose 의 변수 치환을 피해 컨테이너 안 셸에 $ 로 전달하기 위한 이스케이프다.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      # 첫 기동은 initdb 가 도느라 느리다. 이 기간의 실패는 재시도로 세지 않는다.
      start_period: 30s

  # ─────────────────────────────────────────────────────────
  # Redis — 인증(Refresh Token·로그아웃 블랙리스트·로그인 실패 카운터)이 의존한다
  # ─────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # appendonly — 재시작 시 데이터를 살린다. 없으면 컨테이너를 재시작할 때마다
    # 로그인한 사용자 전원의 Refresh Token 이 사라져 다 로그아웃된다.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    # ★ ports 를 두지 않는다. 비밀번호가 없는 Redis라 호스트에도 노출하지 않는다.
    #   app 은 같은 compose 네트워크에서 `redis` 이름으로 붙으므로 포트 공개가 필요 없다.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ─────────────────────────────────────────────────────────
  # 애플리케이션
  # ─────────────────────────────────────────────────────────
  app:
    # 워크플로가 커밋 SHA 태그를 넘긴다. 서버에서 수동으로 띄우면 latest 가 쓰인다.
    image: ${APP_IMAGE:-ghcr.io/daesung-free/dlab-api:latest}
    restart: unless-stopped
    depends_on:
      # ★ service_started 가 아니라 service_healthy 다.
      #   컨테이너가 "떴다"는 것과 PostgreSQL이 "접속을 받는다"는 것은 다르다 —
      #   initdb 가 도는 동안 앱이 먼저 붙으러 갔다가 실패하고 재시작 루프에 들어간다.
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # application-prod.yml 이 참조하는 이름과 1:1로 맞춰져 있다. 바꾸려면 양쪽을 같이 고친다.
      #
      # ★ .env 에 값을 넣는 것만으로는 컨테이너에 전달되지 않는다.
      #   compose 의 .env 는 **이 파일 안의 ${...} 치환**에만 쓰이고,
      #   여기 나열되지 않은 변수는 앱이 볼 수 없다.
      #   실제로 CORS_ALLOWED_ORIGINS 를 .env 에만 넣고 여기 빠뜨려서,
      #   설정을 했는데도 브라우저 요청이 계속 차단된 적이 있다 —
      #   앱 로그에도 아무 흔적이 없어 원인을 찾기 어려웠다.
      #   ⚠️ 앞으로 새 환경변수를 쓸 때마다 이 목록에 한 줄 추가할 것.
      SPRING_PROFILES_ACTIVE: prod
      # 호스트명이 localhost 가 아니라 서비스명 `db` 다. 컨테이너 안의 localhost 는 자기 자신이다.
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      # 관리자 웹이 다른 origin 에서 /api 를 호출한다. 비면 브라우저 요청이 전부 차단된다
      # (차단이 기본, 필요한 origin 만 연다 — application-prod.yml 참고).
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=70 -Dfile.encoding=UTF-8 -Duser.timezone=Asia/Seoul}
    ports:
      # ★ 여기도 127.0.0.1 이다. Nginx가 같은 호스트에서 프록시하므로 외부 공개가 필요 없고,
      #   8080 이 인터넷에 열리면 Nginx를 우회해 actuator 까지 그대로 노출된다.
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      # ★ 넉넉히 준다. 첫 기동에는 Flyway 마이그레이션 전체가 적용된다.
      #   짧으면 정상 기동 중인 앱을 unhealthy 로 판정해 배포가 실패한다.
      start_period: 90s
    logging:
      # 로그 회전이 없으면 json 로그가 무한히 쌓여 디스크를 채운다.
      # 디스크가 차면 PostgreSQL 이 먼저 쓰기를 거부해 앱 전체가 멈춘다.
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  db_data:
  redis_data:
