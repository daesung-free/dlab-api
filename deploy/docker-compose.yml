# 서버(EC2) 배포용 compose.
#
# ★ 루트의 docker-compose.yml 과 다른 파일이다. 그쪽은 로컬 개발용(DB·Redis만 띄우고
#   앱은 IDE에서 실행)이고, 이 파일은 앱까지 컨테이너로 띄운다. 합치지 말 것 —
#   합치면 로컬에서 `docker compose up` 할 때마다 앱 컨테이너가 같이 떠서 8080이 겹친다.
#
# 서버 배치 위치: /home/ubuntu/dlab-api/docker-compose.yml (워크플로가 배포마다 덮어쓴다)
# 같은 디렉터리의 .env 에서 값을 읽는다. 절차는 deploy/README.md 참고.
#
# 사용:
#   docker compose up -d --wait      기동(헬스체크 통과까지 대기)
#   docker compose logs -f app       로그
#   docker compose ps                상태

name: dlab-api

services:
  # ─────────────────────────────────────────────────────────
  # PostgreSQL
  # ─────────────────────────────────────────────────────────
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      # ★ 이 셋은 볼륨이 비어 있을 때 딱 한 번만 반영된다(초기화 시점).
      #   이미 데이터가 있는 볼륨에 대고 비밀번호를 바꿔도 아무 일도 일어나지 않는다 —
      #   앱만 접속에 실패하고, 원인이 안 보여서 한참 헤맨다.
      #   바꾸려면 ALTER USER 로 DB 안에서 바꾸고 .env 를 맞춘다.
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Seoul
    ports:
      # ★ 127.0.0.1 을 반드시 붙인다. "5432:5432" 로 쓰면 docker가 iptables 를 직접 만져
      #   보안그룹과 무관하게 인터넷에 DB가 열린다(UFW로도 안 막힌다).
      #   서버에서 psql 로 붙을 때만 쓰는 통로다.
      - "127.0.0.1:5432:5432"
    volumes:
      # 명명 볼륨 — 컨테이너를 지우고 다시 만들어도 데이터가 남는다.
      # `docker compose down -v` 만이 이걸 지운다(그래서 -v 를 습관적으로 붙이지 말 것).
      - db_data:/var/lib/postgresql/data
    healthcheck:
      # $$ 는 compose 의 변수 치환을 피해 컨테이너 안 셸에 $ 로 전달하기 위한 이스케이프다.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      # 첫 기동은 initdb 가 도느라 느리다. 이 기간의 실패는 재시도로 세지 않는다.
      start_period: 30s

  # ─────────────────────────────────────────────────────────
  # Redis — 인증(Refresh Token·로그아웃 블랙리스트·로그인 실패 카운터)이 의존한다
  # ─────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # appendonly — 재시작 시 데이터를 살린다. 없으면 컨테이너를 재시작할 때마다
    # 로그인한 사용자 전원의 Refresh Token 이 사라져 다 로그아웃된다.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    # ★ ports 를 두지 않는다. 비밀번호가 없는 Redis라 호스트에도 노출하지 않는다.
    #   app 은 같은 compose 네트워크에서 `redis` 이름으로 붙으므로 포트 공개가 필요 없다.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ─────────────────────────────────────────────────────────
  # 애플리케이션
  # ─────────────────────────────────────────────────────────
  app:
    # 워크플로가 커밋 SHA 태그를 넘긴다. 서버에서 수동으로 띄우면 latest 가 쓰인다.
    image: ${APP_IMAGE:-ghcr.io/daesung-free/dlab-api:latest}
    restart: unless-stopped
    depends_on:
      # ★ service_started 가 아니라 service_healthy 다.
      #   컨테이너가 "떴다"는 것과 PostgreSQL이 "접속을 받는다"는 것은 다르다 —
      #   initdb 가 도는 동안 앱이 먼저 붙으러 갔다가 실패하고 재시작 루프에 들어간다.
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # application-prod.yml 이 참조하는 이름과 1:1로 맞춰져 있다. 바꾸려면 양쪽을 같이 고친다.
      #
      # ★ .env 에 값을 넣는 것만으로는 컨테이너에 전달되지 않는다.
      #   compose 의 .env 는 **이 파일 안의 ${...} 치환**에만 쓰이고,
      #   여기 나열되지 않은 변수는 앱이 볼 수 없다.
      #   실제로 CORS_ALLOWED_ORIGINS 를 .env 에만 넣고 여기 빠뜨려서,
      #   설정을 했는데도 브라우저 요청이 계속 차단된 적이 있다 —
      #   앱 로그에도 아무 흔적이 없어 원인을 찾기 어려웠다.
      #   ⚠️ 앞으로 새 환경변수를 쓸 때마다 이 목록에 한 줄 추가할 것.
      SPRING_PROFILES_ACTIVE: prod
      # 호스트명이 localhost 가 아니라 서비스명 `db` 다. 컨테이너 안의 localhost 는 자기 자신이다.
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      # 관리자 웹이 다른 origin 에서 /api 를 호출한다. 비면 브라우저 요청이 전부 차단된다
      # (차단이 기본, 필요한 origin 만 연다 — application-prod.yml 참고).
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # 파일 저장소(S3). 비어 있으면 파일 업로드만 동작하지 않고 앱은 정상 기동한다.
      # ★ 버킷은 공개/비공개 둘이다. 공개 쪽은 CloudFront 도메인으로 서빙한다.
      S3_REGION: ${S3_REGION:-ap-northeast-2}
      S3_BUCKET_PUBLIC: ${S3_BUCKET_PUBLIC:-}
      S3_BUCKET_PRIVATE: ${S3_BUCKET_PRIVATE:-}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      # 결제(KCP). 사이트코드는 DB(pg_site)에 있고 여기에는 인증서 경로만 온다.
      # ⚠️ 인증서·개인키 파일은 서버에 두고(chmod 600) 컨테이너에 마운트해야 한다 —
      #    아래 app.volumes 참고. 경로만 넣고 파일이 없으면 결제만 실패한다.
      KCP_BASE_URL: ${KCP_BASE_URL:-https://stg-spl.kcp.co.kr}
      KCP_CERT_PATH: ${KCP_CERT_PATH:-}
      KCP_PRIVATE_KEY_PATH: ${KCP_PRIVATE_KEY_PATH:-}
      # ★ 개인키는 암호화되어 있다. 이 값이 없으면 키를 못 열어 서명이 안 만들어진다 —
      #   .env 에만 넣고 여기 빠뜨리면 컨테이너까지 전달되지 않아 결제만 조용히 실패한다
      #   (CORS_ALLOWED_ORIGINS 로 한 번 겪은 일이다)
      KCP_PRIVATE_KEY_PASSWORD: ${KCP_PRIVATE_KEY_PASSWORD:-}
      # 문자·알림톡(알리고). ★ 비어 있으면 목업이 남아 **문자가 로그로만 찍히는데
      #   API 는 200 을 준다** — 인증번호가 아무에게도 가지 않는다.
      # ★★ ALIGO_TEST_MODE 가 true 면 과금도 실제 발송도 없이 호출만 성공한다.
      #    운영 전환 때 false 로 바꿀 것(기동 로그에 경고가 남는다).
      # ★ ALIGO_SENDER_KEY(발신프로필 키)는 알림톡 전용이다 — 문자는 없이도 나간다.
      ALIGO_API_KEY: ${ALIGO_API_KEY:-}
      ALIGO_USER_ID: ${ALIGO_USER_ID:-}
      ALIGO_SENDER_KEY: ${ALIGO_SENDER_KEY:-}
      ALIGO_SENDER_PHONE: ${ALIGO_SENDER_PHONE:-}
      ALIGO_TEST_MODE: ${ALIGO_TEST_MODE:-true}
      # ★★ 이관 기간 알림 수신 허용목록. 적은 번호에만 실제로 나간다.
      #   비우면 전면 개방(기본). ⚠️ 이관이 끝나면 비울 것 —
      #   켠 채로 두면 그 번호들만 받고 나머지는 SKIPPED 로만 남는다
      NOTIFICATION_ALLOWLIST: ${NOTIFICATION_ALLOWLIST:-}
      # ★ 감사 로그 조회 기간(년). 비우면 3 — 디랩 확정값이다
      # ★★ 기본값을 ★ 여기에도 둔다 — 숫자 변수라 빈 문자열이 들어가면 기동이 깨진다.
      #    compose 의 ":-" 는 「없음」을 ★ 「있지만 빈 값」으로 바꾸므로,
      #    application.yml 의 ${VAR:3} 기본값이 ★ 적용되지 않는다(빈 문자열이 「값」이다).
      #    ⚠️ 위 문자열 변수들은 빈 값이 무해해서 ":-" 로 두지만 ★ 숫자는 다르다.
      AUDIT_RETENTION_YEARS: ${AUDIT_RETENTION_YEARS:-3}
      # ★★ 대면 OT 전 「신청」 차단(I-24). **기본 꺼짐**이고 범위가 확정되면 켠다 —
      #   범위를 정해 켜 두었다가 기존 동작을 10곳에서 깨뜨린 적이 있다.
      OT_GATE_ENABLED: ${OT_GATE_ENABLED:-false}
      # ★★ FCM 푸시. **이 두 줄이 없으면 .env 에 경로를 넣어도 푸시가 꺼진 채로 돈다.**
      #    실제로 그렇게 배포했다(2026-10-26) — 앱은 멀쩡히 떴고 기동 로그도 조용해서
      #    원인을 찾는 데 시간이 걸렸다. CORS·입학신청 API 키와 **같은 함정이 세 번째다.**
      # ★ 값은 서비스 계정 키(JSON) 의 **컨테이너 안 경로**다(호스트 경로가 아니다).
      #   secrets 는 아래에서 /app/secrets 로 읽기전용 마운트된다.
      #   ⚠️ 파일 주인이 컨테이너 사용자(uid 999)여야 한다 — 호스트 사용자 소유로
      #      chmod 600 을 걸면 **컨테이너가 못 읽는다.** 그때도 앱은 뜨고 푸시만 꺼진다.
      FCM_CREDENTIALS_PATH: ${FCM_CREDENTIALS_PATH:-}
      # true 면 FCM 에 검증만 요청하고 단말로 보내지 않는다
      FCM_DRY_RUN: ${FCM_DRY_RUN:-false}
      # ★★ 홈페이지 입학신청 연동. **이게 비어 있으면 입학신청이 한 건도 안 들어온다.**
      #
      #   ⚠️ 원래 이 블록이 아예 없었다 — .env 에 HOMEPAGE_INTEGRATION_API_KEY 를
      #      넣어 뒀는데 **compose 가 컨테이너에 넘기지 않아** B안이 전부 401 이었다.
      #      값을 넣었다고 되는 것이 아니라 여기에도 적혀 있어야 한다.
      #
      #   A안(/dlab/**, 대성전산 규격) — CLIENT_ID · SECRET
      #     ⚠️ 비면 **인증 실패가 910「토큰이 만료되었습니다」로 내려간다.** 토큰이 없는
      #        것과 자격증명이 빈 것이 밖에서 구분되지 않는다(디지털대성 규격이 그렇다).
      #        그래서 홈페이지 쪽에서는 "토큰을 갱신해도 계속 910" 으로만 보인다.
      #     ★ SECRET 은 평문이어야 한다 — 검증식이 MD5(yyyyMMdd + secret) 라
      #       해시로 저장하면 매일 다시 계산할 수 없다.
      #
      #   B안(/api/v1/homepage/**, REST) — API_KEY
      #     비면 401 이다. ★ A안 토큰과 별개이고 고정 키 하나로 끝난다.
      #
      #   ⚠️ 둘 다 **홈페이지 개발사와 합의한 값**이라 서버에서 임의로 만들면 안 된다.
      HOMEPAGE_INTEGRATION_CLIENT_ID: ${HOMEPAGE_INTEGRATION_CLIENT_ID:-}
      HOMEPAGE_INTEGRATION_SECRET: ${HOMEPAGE_INTEGRATION_SECRET:-}
      HOMEPAGE_INTEGRATION_API_KEY: ${HOMEPAGE_INTEGRATION_API_KEY:-}
      # ★ 저장용 비밀키(AES-256). 도어락 번호를 암호화해 보관하는 데 쓴다.
      #   Base64 로 인코딩된 32바이트여야 한다 — `openssl rand -base64 32` 로 만든다.
      #   비어 있으면 앱은 정상 기동하고 **도어락 번호 등록만** 실패한다.
      #
      # ★★ 한 번 정하면 바꿀 수 없다. 재암호화 경로가 없어서 바꾸면
      #    **이미 등록된 도어락 번호를 전부 못 읽는다.** 서버 .env 백업을 지우지 말 것.
      #
      # ⚠️ 서버의 docker-compose.yml 을 손으로 고쳐도 **배포할 때 이 파일로 덮어써진다.**
      #    새 환경변수는 반드시 여기에 추가해야 한다(위 CORS 사례와 같은 함정이다).
      SECURITY_SECRET_KEY: ${SECURITY_SECRET_KEY:-}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=70 -Dfile.encoding=UTF-8 -Duser.timezone=Asia/Seoul}
    volumes:
      # 결제 인증서·개인키. 호스트의 secrets 를 읽기 전용으로 붙인다 —
      # 이미지에 넣으면 GHCR 에 올라가고, 레포에 넣으면 커밋 히스토리에 남는다.
      - ./secrets:/app/secrets:ro
    ports:
      # ★ 여기도 127.0.0.1 이다. Nginx가 같은 호스트에서 프록시하므로 외부 공개가 필요 없고,
      #   8080 이 인터넷에 열리면 Nginx를 우회해 actuator 까지 그대로 노출된다.
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      # ★ 넉넉히 준다. 첫 기동에는 Flyway 마이그레이션 전체가 적용된다.
      #   짧으면 정상 기동 중인 앱을 unhealthy 로 판정해 배포가 실패한다.
      start_period: 90s
    logging:
      # 로그 회전이 없으면 json 로그가 무한히 쌓여 디스크를 채운다.
      # 디스크가 차면 PostgreSQL 이 먼저 쓰기를 거부해 앱 전체가 멈춘다.
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  db_data:
  redis_data:
