# main 푸시 → 이미지 빌드 → GHCR 푸시 → EC2에서 pull + compose 재기동.
#
# ★ main은 배포 전용 브랜치다(CLAUDE.md §7). develop → main PR에서 CI(ci.yml)가
#   테스트·마이그레이션 검증을 마친 상태를 전제하므로 여기서 테스트를 다시 돌리지 않는다.
#
# ★ 즉 **develop → main 머지가 곧 배포다.** 머지 버튼을 누르는 것이 배포 결정이다.
#
# ⚠️ 이 레포는 private + GitHub Free 라 ruleset·branch protection 이 **적용되지 않는다**
#   ("Your rulesets won't be enforced ... until you upgrade to GitHub Team").
#   즉 GitHub 쪽에서 main 직접 push 를 막아주지 않는다. 대신:
#     - .githooks/pre-push 가 로컬에서 main 직접 push 를 막는다
#       (각자 `git config core.hooksPath .githooks` 1회 설치 — 안 하면 안 걸린다)
#     - 아래 첫 단계가 실행 브랜치를 확인한다 (수동 실행 시 기본값이 develop 이라 필요하다)
#   Team 플랜으로 올리면 ruleset 으로 서버측에서도 막을 수 있다.
#
# ★ 빌드는 러너에서 한다. EC2에서 `docker compose build` 를 돌리면 Gradle 컴파일이
#   메모리를 먹어 돌고 있는 컨테이너가 OOM으로 죽는다. EC2는 이미지를 받기만 한다.
#
# ★ 이미지 전달은 GHCR 경유다. `docker save | ssh docker load` 는 레지스트리가 필요 없는 대신
#   매 배포마다 이미지 전체(300MB+)를 전송한다. GHCR은 바뀐 레이어만 간다.
#
# ★ 헬스체크 실패 시 자동 롤백하지 않는다 — 배포는 곧 Flyway 마이그레이션 적용이라
#   실패 시점에 스키마는 이미 앞으로 나가 있다. 이전 이미지는 ddl-auto=validate 로
#   스키마 검증에 실패해 더 확실하게 죽는다. 실패하면 로그를 띄우고 멈춘다.
#   수동 롤백 절차는 deploy/README.md 참고.

name: Deploy

on:
  push:
    branches: [main]
  # 코드 변경 없이 다시 배포해야 할 때(서버 .env 변경 후 재기동, 실패한 배포 재시도 등).
  # 이때는 브랜치 선택을 main 으로 바꿔야 한다 — 기본값은 레포 기본 브랜치(develop)다.
  workflow_dispatch:

# 배포는 겹치면 안 된다. 앞의 배포를 취소하지 않고 끝날 때까지 기다린다 —
# 중간에 끊으면 이미지만 올라가고 컨테이너 교체가 안 된 상태로 남는다.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  # GHCR 푸시에 필요하다. 기본값이 read 라 이걸 빠뜨리면 푸시에서 403이 난다.
  packages: write

env:
  REGISTRY: ghcr.io
  # daesung-free/dlab-api — GHCR 이미지명은 소문자여야 한다.
  IMAGE_NAME: ${{ github.repository }}
  REMOTE_DIR: /home/ubuntu/dlab-api

jobs:
  deploy:
    name: 이미지 빌드 · 배포
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ★ 수동 실행(workflow_dispatch) 대비 가드다.
      #   push 트리거는 main 으로 한정돼 있지만, 수동 실행은 브랜치를 자유롭게 고를 수 있고
      #   기본값이 develop(레포 기본 브랜치)이라 아무 생각 없이 Run workflow 를 누르면
      #   CI 검증을 안 거친 코드가 그대로 배포된다.
      - name: main 브랜치인지 확인
        if: github.ref_name != 'main'
        run: |
          echo "::error::배포는 main 브랜치에서만 실행할 수 있습니다 (지금: ${{ github.ref_name }})"
          echo "Run workflow 의 브랜치 선택을 main 으로 바꿔 다시 실행하세요."
          exit 1

      - uses: actions/checkout@v4

      # 캐시 마운트·멀티스테이지 최적화를 쓰려면 기본 빌더로는 부족하다.
      - name: Buildx 준비
        uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # 이 잡에서만 유효한 토큰이다. 별도 PAT를 만들어 관리할 필요가 없다.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 이미지 빌드 · 푸시
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # 두 태그를 함께 민다.
          #  - SHA 태그: 이 배포가 정확히 무엇인지 고정한다. 롤백의 기준이다.
          #  - latest: 서버에서 수동으로 `docker compose up -d` 할 때의 기본값.
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          # 러너는 매번 새 머신이라 로컬 캐시가 없다. GitHub 캐시에 레이어를 남긴다 —
          # 이게 없으면 배포마다 의존성을 전부 다시 내려받는다(빌드 5분 → 1분).
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: SSH 준비
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # 개행이 살아있어야 한다. 시크릿을 한 줄로 붙여넣으면 "invalid format"이 난다.
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # 호스트 키를 미리 받아둔다. 없으면 대화형 확인에서 멈춘다.
          # (StrictHostKeyChecking=no 로 끄지 않는 이유: 중간자 공격 시 조용히 통과한다.
          #  더 조이려면 호스트 키를 시크릿으로 고정할 것 — deploy/README.md)
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # ★ compose 파일을 배포마다 덮어쓴다.
      #   서버에서 손으로 고친 compose와 레포의 compose가 갈라지면,
      #   "레포를 봤는데 서버는 다르게 돌고 있는" 상태가 되어 장애 분석이 불가능해진다.
      #   서버에서 바꿔야 할 것은 .env 뿐이고 그건 덮어쓰지 않는다.
      - name: compose 파일 전송
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o ConnectTimeout=15 \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "mkdir -p '${{ env.REMOTE_DIR }}'"
          scp -i ~/.ssh/deploy_key -o ConnectTimeout=15 \
            deploy/docker-compose.yml \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ env.REMOTE_DIR }}/docker-compose.yml"

      - name: 배포 (pull + 재기동)
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o ConnectTimeout=15 \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "REMOTE_DIR='${{ env.REMOTE_DIR }}' \
             APP_IMAGE='${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}' \
             REGISTRY='${{ env.REGISTRY }}' \
             GH_ACTOR='${{ github.actor }}' \
             bash -s" <<'REMOTE'
          set -euo pipefail

          # ★ 토큰만 명령줄이 아니라 stdin(이 heredoc)으로 넘긴다.
          #   ssh 뒤에 붙이면 EC2에서 `ps` 로 값이 그대로 보인다. heredoc 본문은 안 보인다.
          #   (heredoc 을 'REMOTE' 로 따옴표 쳐도 Actions 표현식은 먼저 치환되므로 값이 들어간다.
          #    ⚠️ 이 주석에 빈 표현식 기호를 그대로 쓰면 워크플로 파일 전체가 파싱에 실패한다 —
          #       Actions 는 주석까지 스캔한다. 실제로 한 번 걸렸다.)
          GH_TOKEN='${{ secrets.GITHUB_TOKEN }}'

          cd "$REMOTE_DIR"

          if [ ! -f .env ]; then
            echo "::error::$REMOTE_DIR/.env 가 없습니다. 최초 셋업이 끝나지 않았습니다 (deploy/README.md)"
            exit 1
          fi

          # ★ 이 배포 동안만 유효한 토큰으로 로그인한다.
          #   서버에 장기 PAT를 저장해두면 그게 유출 표면이 된다 — 끝나면 로그아웃한다.
          echo "$GH_TOKEN" | docker login "$REGISTRY" -u "$GH_ACTOR" --password-stdin
          trap 'docker logout "$REGISTRY" > /dev/null 2>&1 || true' EXIT

          echo "배포 이미지: $APP_IMAGE"
          # APP_IMAGE 를 셸 환경으로 넘긴다. compose 는 .env 파일보다 셸 환경변수를 우선하므로
          # .env 를 건드리지 않고도 이번 배포만 SHA 태그로 고정된다.
          export APP_IMAGE

          docker compose pull

          # --wait 가 핵심이다. 이게 없으면 컨테이너를 "만들었다"에서 성공으로 끝나,
          # 마이그레이션 실패로 죽은 배포가 초록불이 된다.
          # compose 의 healthcheck(start_period 90s)를 통과할 때까지 기다린다.
          #
          # ★ db·redis 는 이미 healthy 면 재생성되지 않는다(이미지가 그대로이므로).
          #   교체되는 것은 app 컨테이너뿐이다.
          docker compose up -d --wait --wait-timeout 300
          REMOTE

      # up --wait 가 실패하면 위 단계가 이미 exit 1 이다. 원인을 여기서 뽑아둔다 —
      # 이게 없으면 Actions 로그에 "timeout" 한 줄만 남아 아무것도 알 수 없다.
      - name: 실패 시 로그 수집
        if: failure()
        run: |
          set -uo pipefail
          ssh -i ~/.ssh/deploy_key -o ConnectTimeout=15 \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "REMOTE_DIR='${{ env.REMOTE_DIR }}' bash -s" <<'REMOTE' || true
          cd "$REMOTE_DIR" || exit 0
          echo "----- 컨테이너 상태 -----"
          docker compose ps
          echo "----- app 로그 150줄 -----"
          # 실패 원인은 대부분 여기 있다: 마이그레이션 충돌, .env 값 누락(JWT_SECRET),
          # ddl-auto=validate 의 스키마 불일치, db 인증 실패.
          docker compose logs --tail 150 app
          echo "----- db 로그 50줄 -----"
          docker compose logs --tail 50 db
          REMOTE

      # 오래된 이미지가 쌓이면 디스크가 찬다. 디스크가 차면 PostgreSQL이 먼저 쓰기를 거부해
      # 앱 전체가 멈추는데, 원인이 "디스크"라는 게 로그에서 잘 안 보인다.
      #
      # ★ -a 를 쓰지 않는다. `image prune -a` 는 "돌고 있지 않은" 이미지를 전부 지워
      #   롤백 대상인 직전 이미지까지 날린다. 24시간보다 오래된 것만 지운다.
      - name: 오래된 이미지 정리
        if: success()
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o ConnectTimeout=15 \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "docker image prune -f --filter 'until=24h'"

      - name: 배포 요약
        if: always()
        run: |
          {
            echo "## 배포 결과: ${{ job.status }}"
            echo ""
            echo "- 이미지: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}\`"
            echo "- 대상: ${{ secrets.EC2_HOST }}"
            echo ""
            if [ "${{ job.status }}" != "success" ]; then
              echo "수동 롤백 절차는 \`deploy/README.md\` 참고."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
