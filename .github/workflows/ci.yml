# PR마다 빌드와 테스트를 돌린다 (develop 대상 · main 대상 둘 다).
#
# ★ 왜 필요한가 — 테스트가 로컬에서만 돌면 "각자 자기 브랜치에서는 통과"만 확인된다.
#   여러 명이 같은 develop에 병렬로 밀어넣는 구조라, 머지하고 나서야 깨진 것을 알게 된다.
#   실제로 설계 충돌(같은 테이블을 각자 다르게 제약)이 머지 시점에 발견된 적이 있다.
#   그래서 PR 은 **머지 결과(base+head 합친 커밋)** 를 검증한다 — 머지 전에 충돌이 드러난다.
#
# ★ main 대상 PR 을 포함하는 이유: main 머지가 곧 배포다(deploy.yml).
#   배포 직전에 한 번 더 거르는 관문이다.
#
# ★ 서비스 컨테이너로 진짜 PostgreSQL·Redis를 띄운다.
#   H2로 대체할 수 없다 — jsonb·부분 유니크 인덱스를 쓰고, Flyway 마이그레이션 자체가
#   검증 대상이기 때문이다(src/test/resources/application.yml 참고).

name: CI

# ★ PR 과 develop 푸시 양쪽에서 돈다.
#
#   한때 `push: branches: [develop]` 를 뺀 적이 있다 — develop 에 머지된 커밋이 곧
#   develop → main PR 의 head 라서 릴리스 PR 화면에 잡이 두 배로 떴기 때문이다.
#   **그 판단을 되돌린다.** 러너 시간보다 "develop 이 깨진 채 방치되는 것"이 비싸다.
#
# ★ 되돌린 이유 — PR 검증만으로는 못 잡는 구멍이 실제로 터졌다 (2026-08-25).
#   PR #42(교습비 청구)와 #43(급식 청구)이 `ErrorCode` 에 **같은 상수를 각자 추가**했다.
#   파일 안 위치가 달라 git 이 충돌로 보지 않았고, 두 PR 은 각각 통과했다.
#   그런데 #43 은 #42 가 머지되기 **전에** 만들어져서 낡은 base 로 검증됐고,
#   #42 가 머지된 뒤에도 새 푸시가 없어 CI 가 다시 돌지 않았다.
#   9초 간격으로 둘 다 머지되자 **develop 이 컴파일되지 않는 상태**가 됐다.
#
#   표준 해법은 브랜치 보호의 "Require branches to be up to date before merging" 인데,
#   **비공개 레포 무료 플랜이라 브랜치 보호를 켤 수 없다**(API 403).
#   그래서 "머지된 결과를 사후에라도 검증"하는 쪽으로 막는다.
#
# ⚠️ 여전히 남는 것: 깨진 것을 **머지 후에** 알게 된다. 막지는 못하고 빨리 알 뿐이다.
#   연달아 머지할 때는 앞 PR 이 들어간 뒤 뒤 PR 브랜치에 develop 을 한 번 머지해
#   CI 를 다시 돌리는 편이 안전하다.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

# 같은 브랜치에 연속으로 푸시하면 앞의 실행을 취소한다 — 오래된 결과를 기다릴 이유가 없다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 빌드 · 테스트
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dlab
          POSTGRES_PASSWORD: dlab_local_password
          # 테스트 설정이 이 이름을 본다. 바꾸려면 application.yml도 같이 고쳐야 한다.
          POSTGRES_DB: dlab_test
        ports: ['5432:5432']
        # 헬스체크가 없으면 DB가 뜨기 전에 테스트가 시작돼 컨텍스트 로드 단계에서 전부 실패한다
        options: >-
          --health-cmd "pg_isready -U dlab -d dlab_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Gradle 캐시
        uses: gradle/actions/setup-gradle@v4

      - name: 테스트
        run: ./gradlew test --no-daemon

      # 실패했을 때 무엇이 깨졌는지 로그만 보고 알기 어렵다. 리포트를 받아둔다.
      - name: 테스트 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            build/reports/tests/test
            build/test-results/test
          retention-days: 7

      # 통과/실패만 보면 "몇 건이 돌았는지"를 모른다 — 테스트가 통째로 안 돌아도 초록불이 된다.
      - name: 테스트 건수 요약
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, re
          total = failed = skipped = 0
          for path in glob.glob('build/test-results/test/*.xml'):
              head = open(path, encoding='utf-8').read(600)
              m = re.search(r'tests="(\d+)".*?skipped="(\d+)".*?failures="(\d+)".*?errors="(\d+)"', head)
              if m:
                  total += int(m.group(1))
                  skipped += int(m.group(2))
                  failed += int(m.group(3)) + int(m.group(4))
          print(f"## 테스트 결과\n\n- 총 **{total}건**\n- 실패 **{failed}건**\n- 건너뜀 {skipped}건")
          PY

  # 마이그레이션 순서·체크섬 문제는 "남의 환경"에서만 터진다.
  # 빈 DB에 전부 적용해봐야 그걸 미리 잡는다 — 실제로 out-of-order 때문에 기동이 실패한 적이 있다.
  migration:
    name: Flyway 검증 (빈 DB)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dlab
          POSTGRES_PASSWORD: dlab_local_password
          POSTGRES_DB: dlab_migration_check
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dlab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Gradle 캐시
        uses: gradle/actions/setup-gradle@v4

      # ★ out-of-order를 끈다.
      #   로컬은 여러 명이 며칠씩 쌓다가 푸시하므로 켜두지만, 운영은 순차 배포라 꺼져 있다.
      #   여기서 꺼두면 "로컬에서는 되는데 운영 배포에서 터지는" 순서 역전을 미리 잡는다.
      #
      # ddl-auto=validate라 엔티티와 스키마가 어긋나도 여기서 실패한다.
      - name: 빈 DB에 마이그레이션 전체 적용
        run: |
          ./gradlew bootRun --no-daemon --args='--spring.profiles.active=ci' &
          APP_PID=$!
          for i in $(seq 1 60); do
            if curl -sf localhost:8080/actuator/health > /dev/null 2>&1; then
              echo "기동 성공 — 마이그레이션 전체 적용 확인"
              kill $APP_PID
              exit 0
            fi
            if ! kill -0 $APP_PID 2>/dev/null; then
              echo "::error::기동 실패 — 마이그레이션 또는 스키마 검증에서 멈췄습니다"
              exit 1
            fi
            sleep 3
          done
          echo "::error::기동 타임아웃"
          kill $APP_PID
          exit 1
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/dlab_migration_check
          SPRING_DATASOURCE_USERNAME: dlab
          SPRING_DATASOURCE_PASSWORD: dlab_local_password

  # ★ 배포 리허설 — 지금 main 에 올리면 뜨는가.
  #
  # 위 "Flyway 검증"은 **빈 DB**에 전부 적용해본다. 그래서 못 잡는 것이 있다:
  # **이미 적용된 것 위에 새 마이그레이션이 얹힐 때만** 나는 문제다.
  #
  # 실제로 2026-09-01 에 터졌다. 파일명 두 방식이 섞여 있어
  # `V20260830_1000`(→ 20260830.1000)이 `V20260819100000`(→ 20260819100000)보다 **작다.**
  # 빈 DB 에서는 순서대로 들어가니 통과하는데, main 상태 DB 에 올리면
  # *"Detected resolved migration not applied"* 로 기동이 실패했다.
  # 41커밋을 쌓아두고 배포하려던 참이라, 손으로 리허설해보지 않았으면 배포에서 알았을 것이다.
  #
  # 그래서 **main 상태를 재현한 DB 에 지금 코드를 올려본다.** 잡는 것:
  #   · 이번 배포에서만 드러나는 out-of-order·체크섬 문제
  #   · 기존 데이터가 있을 때만 실패하는 마이그레이션(유니크 인덱스·NOT NULL 추가 등)
  #   · 엔티티와 스키마 불일치(ddl-auto=validate)
  #
  # ⚠️ 운영 프로필을 그대로 쓰지 않는다 — JWT_SECRET 등 운영 비밀값이 필요해서다.
  #   대신 out-of-order 만 운영과 같게 맞춘다(application-prod.yml 참고).
  deploy-rehearsal:
    name: 배포 리허설 (main 상태 DB 에 올려보기)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dlab
          POSTGRES_PASSWORD: dlab_local_password
          POSTGRES_DB: dlab_rehearsal
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dlab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      # main 을 체크아웃해야 하므로 전체 히스토리가 필요하다
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Gradle 캐시
        uses: gradle/actions/setup-gradle@v4

      # ① 배포 대상(main)의 스키마를 재현한다.
      #    main 이 아직 비어 있는 초기 상태면 이 단계는 그냥 전체 적용이 되고, 그래도 무해하다.
      - name: main 상태로 DB 준비
        run: |
          # 돌아올 지점을 먼저 잡아둔다. detached HEAD 에서 `git checkout -` 은 믿기 어렵다
          echo "TARGET_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git checkout --detach origin/main

          ./gradlew bootRun --no-daemon --args='--spring.profiles.active=ci' &
          for i in $(seq 1 60); do
            if curl -sf localhost:8080/actuator/health > /dev/null 2>&1; then
              echo "main 스키마 준비 완료"
              break
            fi
            sleep 3
          done

          # ★ 반드시 완전히 죽인다. gradle 만 죽이면 fork 된 java 가 8080 을 계속 물고 있고,
          #   그러면 다음 단계가 **옛 앱의 헬스체크를 보고 성공으로 착각한다.**
          pkill -f 'DlabApiApplication' || true
          pkill -f 'GradleWrapperMain' || true
          for i in $(seq 1 20); do
            curl -sf localhost:8080/actuator/health > /dev/null 2>&1 || break
            sleep 1
          done
          if curl -sf localhost:8080/actuator/health > /dev/null 2>&1; then
            echo "::error::이전 앱이 안 죽었습니다 — 리허설 결과를 믿을 수 없습니다"
            exit 1
          fi

          APPLIED=$(PGPASSWORD=dlab_local_password psql -h localhost -U dlab -d dlab_rehearsal \
                      -tAc "SELECT count(*) FROM flyway_schema_history WHERE success" 2>/dev/null || echo 0)
          echo "main 기준 적용 수: $APPLIED"
          if [ "$APPLIED" = "0" ]; then
            echo "::error::main 기동이 실패했거나 마이그레이션이 하나도 안 들어갔습니다"
            exit 1
          fi
          echo "BASE_APPLIED=$APPLIED" >> "$GITHUB_ENV"
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/dlab_rehearsal
          SPRING_DATASOURCE_USERNAME: dlab
          SPRING_DATASOURCE_PASSWORD: dlab_local_password

      # ② 그 DB 위에 지금 코드를 올린다. 이게 실제 배포에서 벌어지는 일이다.
      - name: 지금 코드를 그 위에 올린다
        run: |
          git checkout --detach "$TARGET_SHA"
          ./gradlew bootRun --no-daemon \
            --args='--spring.profiles.active=ci --spring.flyway.out-of-order=true' &
          APP_PID=$!
          for i in $(seq 1 60); do
            if curl -sf localhost:8080/actuator/health > /dev/null 2>&1; then
              echo "배포 리허설 성공 — main 상태 위에 올라갑니다"
              pkill -f 'DlabApiApplication' || true
              exit 0
            fi
            if ! kill -0 $APP_PID 2>/dev/null; then
              echo "::error::배포하면 기동이 실패합니다. 마이그레이션 또는 스키마 검증을 확인하세요"
              exit 1
            fi
            sleep 3
          done
          echo "::error::기동 타임아웃"
          exit 1
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/dlab_rehearsal
          SPRING_DATASOURCE_USERNAME: dlab
          SPRING_DATASOURCE_PASSWORD: dlab_local_password

      # 몇 개가 새로 적용됐는지 보이면 "이번 배포가 스키마를 얼마나 바꾸는지"를 알 수 있다.
      - name: 적용 결과 요약
        if: always()
        run: |
          {
            echo "## 배포 리허설"
            echo ""
            echo "- main 기준 **${BASE_APPLIED:-?}개**"
            PGPASSWORD=dlab_local_password psql -h localhost -U dlab -d dlab_rehearsal -tAc \
              "SELECT '- 이번 배포 후 **' || count(*) || '개** (최종 ' || max(version) || ')'
                 FROM flyway_schema_history WHERE success" 2>/dev/null \
              || echo "- (조회 실패)"
          } >> "$GITHUB_STEP_SUMMARY"
