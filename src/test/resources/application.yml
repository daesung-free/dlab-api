# 테스트 설정.
# 스키마는 Flyway가 관리하므로 테스트도 실제 PostgreSQL에서 돌려야 마이그레이션까지 검증된다
# (jsonb·부분 유니크 인덱스를 쓰므로 H2로는 검증되지 않는다).
# docker-compose로 띄운 로컬 PostgreSQL의 별도 DB(dlab_test)를 쓴다 — 개발용 dlab_local과 분리.
#
# 최초 1회 테스트 DB 생성:
#   docker exec dlab-postgres-local psql -U dlab -d postgres -c "CREATE DATABASE dlab_test OWNER dlab;"
#
# ★ 5432·6379를 다른 프로젝트가 쓰고 있으면 임시 컨테이너를 다른 포트에 띄우고 환경변수로 덮어쓴다.
#   (@SpringBootTest 통합 테스트는 DB가 없으면 컨텍스트 로드 단계에서 한꺼번에 실패한다)
#     docker run -d --name dlab-it-db -e POSTGRES_USER=dlab -e POSTGRES_PASSWORD=dlab_local_password \
#       -e POSTGRES_DB=dlab_test -p 55434:5432 postgres:16
#     docker run -d --name dlab-it-redis -p 56380:6379 redis:7
#     SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:55434/dlab_test \
#     SPRING_DATA_REDIS_PORT=56380 ./gradlew test --no-daemon
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/dlab_test
    hikari:
      # ★ 테스트는 컨텍스트를 여러 벌 띄운다(@MockitoBean 조합이 다르면 캐시가 갈린다).
      #   컨텍스트마다 풀을 열기 때문에 기본값(10)이면 PostgreSQL max_connections(100)를
      #   금방 넘어 "sorry, too many clients already" 로 무관한 테스트가 무더기로 깨진다.
      #   원인이 방금 추가한 테스트처럼 보여서 찾는 데 오래 걸린다.
      maximum-pool-size: 4
      minimum-idle: 0
      # 안 쓰는 풀은 빨리 닫아 다음 컨텍스트에 자리를 내준다
      idle-timeout: 10000
    username: dlab
    password: dlab_local_password

  jpa:
    hibernate:
      # 스키마는 Flyway가 만들고 JPA는 검증만 한다.
      # 엔티티와 마이그레이션이 어긋나면 컨텍스트 기동 단계에서 바로 실패한다.
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    # 타임스탬프 버전이라 늦게 푸시된 과거 시각 마이그레이션이 뒤늦게 올 수 있다.
    # 개발 환경만 허용한다 — 운영은 순차 배포라 발생하지 않는다.
    out-of-order: true
    # 테스트는 매번 깨끗한 스키마에서 시작한다
    clean-disabled: false

jwt:
  secret: test-only-secret-value-at-least-32-bytes
  access-token-ttl: 30m
  refresh-token-ttl: 14d
