# ─────────────────────────────────────────────────────────────
# 운영 프로필
#
# ★ 이 프로젝트는 dev/prod 서버를 따로 두지 않고 **같은 서버를 전환**한다(CLAUDE.md §3).
#   그래서 이 파일은 "다른 서버의 설정"이 아니라 **전환 시점에 바뀌어야 하는 것들의 목록**이다.
#   컷오버 체크리스트(§4)와 함께 본다.
#
# ★ 비밀값에 기본값을 두지 않는다. application.yml은 로컬 편의를 위해 기본값을 갖고 있는데
#   (예: JWT_SECRET), 운영에서 그 값이 그대로 쓰이면 토큰을 누구나 위조할 수 있다.
#   여기서 기본값 없이 다시 선언해 **환경변수가 없으면 기동이 실패**하게 한다 —
#   조용히 약한 값으로 뜨는 것보다 안 뜨는 편이 낫다.
# ─────────────────────────────────────────────────────────────
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

  jpa:
    hibernate:
      ddl-auto: validate   # 스키마는 Flyway가 관리한다. 운영에서 JPA가 손대면 안 된다
    show-sql: false        # SQL에 학생 식별자가 실려 로그에 남는다

  flyway:
    enabled: true
    locations: classpath:db/migration
    # ★ true 여야 한다 — 원래 false 였고 그 이유가 *"운영은 순차 배포라 켤 이유가 없다"* 였는데
    #   그 전제가 틀렸다. 파일명 두 방식이 섞여 있어 **밑줄 방식은 영구히 14자리보다 작다**:
    #
    #     V20260819100000__...  →  20260819100000
    #     V20260830_1000__...   →  20260830.1000     ← 훨씬 작다
    #
    #   14자리 파일이 15개 있고 그중 최신이 20260819100000 이라, 앞으로 만드는 밑줄 방식
    #   마이그레이션은 **전부** out-of-order 로 잡힌다. 배포마다 기동이 실패한다.
    #
    #   실제로 2026-09-01 에 main 상태 DB 에 develop 을 올려보니
    #   *"Detected resolved migration not applied to database: 20260820.1000"* 로 기동이 실패했다.
    #
    #   ⚠️ 근본 해법은 파일명 통일이지만, 이미 적용된 것을 바꾸면 체크섬·버전이 어긋나
    #   다른 환경이 기동하지 않는다(§7). 그래서 여기를 켠다.
    #   ★ 빈 DB 에서는 이 값과 무관하게 버전 순서대로 적용되므로, CI 의 순서 검증은
    #     그대로 유효하다(application-ci.yml 은 false 를 유지한다).
    out-of-order: true

jwt:
  # 기본값 없음 — 없으면 기동 실패한다
  secret: ${JWT_SECRET}

# ★ 운영 origin은 서버 .env 로만 들어온다. 여기 값을 적어두지 않는다 —
#   도메인이 바뀔 때마다 재배포해야 하고, 스테이징/운영이 갈릴 때 파일이 하나 더 필요해진다.
#   비워두면 브라우저에서 오는 /api 요청이 전부 차단된다 — 관리자 웹을 배포하기 전까지는
#   그게 맞는 상태다(차단이 기본, 필요한 origin만 연다).
#   정해지면: CORS_ALLOWED_ORIGINS=https://admin.example.com  (여러 개면 콤마로 구분)
#   ⚠️ 비어 있으면 기동 로그에 경고가 남는다. 프론트에서 원인 불명 CORS 오류로 보이는 것을 막기 위함이다.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

# ─────────────────────────────────────────────────────────────
# 운영 감시
#
# ★ 키오스크는 우리 장애를 알려주지 않는다(그쪽 폴백이 가린다, CLAUDE.md §3).
#   바깥에서 /actuator/health/kiosk 를 주기적으로 찔러야 한다.
#
# ★ 루트 health는 상세를 감춘다. DB·Redis 컴포넌트 상세에 접속 실패 사유·버전이 드러난다.
#   반면 kiosk 그룹은 상세가 곧 목적이라(에러율·마지막 호출시각) 열어둔다 —
#   여기 드러나는 것은 이미 공개된 키오스크 엔드포인트 경로뿐이다.
#
# ⚠️ 그래도 인터넷에 그대로 두지 말 것. 접근 자체를 보안그룹·VPC로 좁히는 것이 정석이고,
#   아래 설정은 "열려 있어도 개인정보는 안 나간다" 수준의 방어다.
# ─────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health   # env·beans·heapdump는 절대 열지 않는다
  endpoint:
    health:
      show-details: never
      group:
        kiosk:
          include: kioskCompat
          show-details: always

logging:
  level:
    root: INFO
    com.dlab: INFO
    # 쿼리 로그에 학생 식별자가 실린다
    org.hibernate.SQL: WARN

# ─────────────────────────────────────────────────────────────
# 프록시 뒤에서 뜬다 — Nginx(443) → app(127.0.0.1:8080)
#
# ★ 이게 없으면 HTTPS 를 붙여도 앱은 자기를 http 로 인식한다.
#   Nginx 가 X-Forwarded-Proto: https 를 보내지만(deploy/README.md 3번)
#   Spring 이 그 헤더를 읽지 않아 request.getScheme() 이 계속 "http" 다.
#
#   그래서 springdoc 이 뱉는 서버 URL 이 http://api.d-dlab.link 로 나가고,
#   dlab-admin-web·dlab-app 이 **그 스펙으로 클라이언트를 생성한다**(CLAUDE.md §6-4).
#   생성된 코드가 http 로 호출하면 브라우저는 mixed content 로 막고,
#   iOS 는 ATS 로 막는다 — 원인이 서버 설정에 있다는 게 클라이언트 쪽에서는 안 보인다.
#
#   리다이렉트 Location 헤더와 클라이언트 IP 판별(로그인 실패 5회 잠금)도 같은 헤더를 탄다.
#
# ★ framework 는 Spring 내장 ForwardedHeaderFilter 를 켠다.
#   native(=서블릿 컨테이너에 위임)와 달리 Tomcat RemoteIpValve 설정이 따로 필요 없다.
#
# ⚠️ 신뢰할 수 있는 프록시 뒤에서만 쓴다. 8080 은 127.0.0.1 에만 바인딩돼 있어
#   Nginx 를 거치지 않고는 도달할 수 없다(deploy/docker-compose.yml) — 전제가 성립한다.
# ─────────────────────────────────────────────────────────────
server:
  forward-headers-strategy: framework
