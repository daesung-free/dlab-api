spring:
  application:
    name: dlab-api

logging:
  pattern:
    # traceId를 모든 로그 줄에 붙인다. 없으면 동시 요청의 로그가 뒤섞여 추적이 불가능하다.
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:-        }] %logger{36} - %msg%n"

springdoc:
  # 이 레포가 스펙의 단일 진실 공급원이다(CLAUDE.md §6-4).
  # dlab-admin-web·dlab-app이 여기서 타입을 생성한다.
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    # 그룹(app/admin) 순서를 알파벳이 아니라 선언 순서로
    groups-order: asc
    tags-sorter: alpha
    operations-sorter: alpha

# ─────────────────────────────────────────────────────────────
# CORS — 관리자 웹(dlab-admin-web)이 다른 origin에서 /api 를 호출한다.
#
# ★ 기본은 "전부 차단"이다. 여기에 값을 두지 않는다.
#   로컬 개발용 origin은 application-local.yml 이, 운영 도메인은 서버 .env 의
#   CORS_ALLOWED_ORIGINS 가 각각 공급한다. 공통 설정에 열어두면
#   **프로필을 안 준 채 뜬 서버가 조용히 열린 상태**가 된다.
#
# ★ 와일드카드(http://localhost:*)도 기술적으로는 동작하지만(allowedOriginPatterns)
#   쓰지 않는다 — 필요한 origin만 콤마로 나열한다. 목록이 곧 "누가 이 API를 부르는가"의
#   문서가 되고, 실수로 범위가 넓어지는 일이 없다.
#
# ★ 앱(Flutter 네이티브)과 키오스크에는 해당 없다 — 브라우저가 아니라 CORS가 적용되지 않는다.
# ─────────────────────────────────────────────────────────────
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

jwt:
  # 운영 값은 환경변수로 주입한다. 커밋 금지(CLAUDE.md §8).
  # HS256이 최소 256비트를 요구하므로 32바이트 이상이어야 하고, 짧으면 기동 시점에 막힌다.
  secret: ${JWT_SECRET:local-only-dev-secret-do-not-use-in-production-32b}
  # 앱 요구사항 A-1 기준
  access-ttl: PT1H
  refresh-ttl: P7D

# ─────────────────────────────────────────────────────────────
# 운영 감시
#
# ★ 키오스크 구획은 우리 장애가 그쪽 화면에서 안 보인다(폴백이 가린다, CLAUDE.md §3).
#   /actuator/health/kiosk 를 외부 모니터가 주기적으로 확인해야 한다.
#
# ⚠️ 컷오버 전에 접근 제한을 걸 것. 지금은 기본 체인이 permitAll이라 누구나 볼 수 있다.
#   상세(show-details)에 에러 경로가 드러나므로 운영에서는 VPC 내부·보안그룹으로 막거나
#   actuator 전용 인증을 붙여야 한다.
# ─────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        # health만 연다. env·beans 등은 내부 구조가 그대로 드러난다
        include: health
  endpoint:
    health:
      show-details: always
      # ★ 그룹으로 고정한다. 컴포넌트 경로(/actuator/health/{이름})는 상세 노출 설정에
      #   좌우돼서, 운영에서 루트 상세를 감추면 감시 창구까지 같이 사라진다.
      #   그룹은 자기 show-details를 따로 가지므로 경로가 프로필과 무관하게 유지된다
      group:
        kiosk:
          include: kioskCompat
          show-details: always
